<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordeaux Classified</title>
<meta name="description" content="Interactive map and vintage dashboard of every classified estate in Bordeaux — 1855, Saint-Émilion, Graves, Crus Bourgeois, Crus Artisans and Pomerol, across 44 vintages.">
<meta name="theme-color" content="#1e3064">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <img class="crest" src="assets/crest.png" width="114" height="108"
         alt="Commanderie de Bordeaux">
    <h1>Bordeaux Classified
      <small>Every estate on both banks · 21 appellations · six classifications · 44 vintages, 1982–2025</small>
    </h1>
    <div class="masthead-spacer"></div>

    <button class="iconbtn" id="installBtn" hidden>Install app</button>
    <button class="iconbtn" id="themeBtn">☾ Dark</button>
    <div class="settings-wrap">
      <button class="iconbtn" id="settingsBtn" aria-expanded="false"
              aria-controls="settings">⚙ Settings</button>
      <div class="settings" id="settings" hidden>
        <p class="settings-head">Language</p>
        <div class="settings-opts" id="langOpts"></div>
        <p class="settings-note">The interface. What the châteaux and the
          vintage reports say is left in the language it was published in.</p>
      </div>
    </div>
  </div>
</header>

<nav class="tabbar" role="tablist">
  <button class="tab" id="tabAppellations" role="tab" aria-selected="true">Appellations</button>
  <button class="tab" id="tabClassifications" role="tab" aria-selected="false">Classifications</button>
  <button class="tab" id="tabGrapes" role="tab" aria-selected="false">Grapes</button>
  <button class="tab" id="tabProducers" role="tab" aria-selected="false">Producers &amp; map</button>
  <button class="tab" id="tabVintages" role="tab" aria-selected="false">Vintage reports</button>
  <button class="tab" id="tabCompare" role="tab" aria-selected="false">Compare</button>
  <button class="tab" id="tabCellar" role="tab" aria-selected="false">My cellar <span class="tabcount" id="cellarCount"></span></button>
  <span class="crumb" id="crumb"></span>
</nav>

<div class="filters" id="filters" style="display:none">
  <div class="field">
    <label for="search">Search</label>
    <input type="search" id="search" placeholder="Château, commune, proprietor…">
  </div>
  <!-- narrow-hide: on a phone this bar took more of the screen than the
       map it filters, so only the search box is kept. The chips below
       are not hidden, because they are the one way to see and undo a
       filter that was set on a wider screen. -->
  <div class="field narrow-hide">
    <label for="appellation">Appellation</label>
    <select id="appellation"></select>
  </div>
  <div class="field narrow-hide">
    <label for="vintage">Show scores from</label>
    <select id="vintage"></select>
  </div>
  <div class="field narrow-hide" style="align-self:flex-end">
    <button class="iconbtn" id="resetBtn">Reset</button>
  </div>
  <span class="resultcount narrow-hide" id="resultcount"></span>
  <div class="chips" id="chips" style="flex-basis:100%"></div>
</div>

<section class="refpage" id="appellations"></section>
<section class="refpage" id="classifications" style="display:none"></section>
<section class="refpage" id="grapes" style="display:none"></section>
<section class="refpage" id="compare" style="display:none"></section>
<section class="refpage" id="cellar" style="display:none"></section>

<div class="workspace" id="workspace" style="display:none">
  <div class="pane-map">
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" style="display:none"></div>
  </div>
  <div class="pane-list" id="paneList"></div>
  <button class="list-close" id="listClose" aria-label="Close the château list">✕</button>
</div>

<div class="vintagegrid" id="vintageGrid" style="display:none"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Estate detail">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="data/geography.js"></script>
<script src="data/appellations.js"></script>
<script src="data/water.js"></script>
<script src="data/classifications.js"></script>
<script src="data/notes.js"></script>
<script src="data/notes-nl.js"></script>
<script src="data/grapes.js"></script>
<script src="data/grapes-nl.js"></script>
<script src="data/chateaux.js"></script>
<script src="data/sauternes.js"></script>
<script src="data/saintemilion.js"></script>
<script src="data/pomerol.js"></script>
<script src="data/graves.js"></script>
<script src="data/crubourgeois.js"></script>
<script src="data/cruartisan.js"></script>
<script src="data/libournais.js"></script>
<script src="data/batch2.js"></script>
<script src="data/batch3.js"></script>
<script src="data/batch4.js"></script>
<script src="data/vintages.js"></script>
<script src="data/vintages-nl.js"></script>
<script src="data/rightbank.js"></script>
<script src="data/ratings.js"></script>
<script src="data/climate.js"></script>
<script src="data/fiches.js"></script>
<script src="data/fiches-nl.js"></script>
<script src="data/cuvees.js"></script>
<script src="data/coords.js"></script>
<script src="data/phenology.js"></script>
<script src="data/websites.js"></script>
<script src="data/plantings.js"></script>
<script src="data/terroir.js"></script>
<script src="data/cellar.js"></script>
<script src="data/fiches-url.js"></script>
  <script src="data/cuvee-url.js"></script>
<script src="data/overrides.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
